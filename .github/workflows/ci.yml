# Runs on every pull request into main, and on main itself so the branch's own
# status is always known. Branch protection requires the `check` job, so the job
# name here must stay in sync with the required-status-checks configuration.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a PR makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only, and declared at the top level so no job can silently inherit more.
# This workflow only needs to check out the code and run two commands; nothing
# here writes to the repository. Note also that the trigger above is
# `pull_request`, not `pull_request_target` — a pull request from a fork runs the
# fork's code with no access to repository secrets. Do not switch to
# `pull_request_target` to "fix" a fork-related failure: that combination runs
# untrusted code with a privileged token, and there are no secrets to be gained
# by it here anyway.
permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs rather than tags. A tag like `v5` is a
      # moving pointer the action's owner can repoint at any commit, so trusting
      # it is trusting that account not to be compromised. The comment records
      # which release each SHA was, and Dependabot advances them.
      #
      # persist-credentials: false keeps the job's token out of .git/config,
      # where any later step — including a dependency's build script — could
      # read it back out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      # Reads the version from package.json's `packageManager` field, and caches
      # the pnpm store keyed on the lockfile.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile makes the install fail rather than silently resolve a
      # dependency the lockfile does not already pin. Combined with pnpm 10's
      # default of not running dependency lifecycle scripts (see
      # `onlyBuiltDependencies` in package.json), a pull request cannot pull in
      # an unreviewed package and have it execute during install.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test
