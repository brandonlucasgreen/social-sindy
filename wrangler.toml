name = "social-cally"
main = "src/index.tsx"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# Custom Domain, not a route: Cloudflare creates the proxied DNS record and
# provisions the certificate itself. A hand-made CNAME to workers.dev would not
# route here.
#
# Declaring any route turns `workers_dev` off by default, so the old
# *.workers.dev origin is now dead and this is the only way in. That is
# deliberate — one origin means one OAuth redirect URI and one feed hostname.
[[routes]]
pattern = "social-cally.bgreen.lol"
custom_domain = true

# Feed responses are cached here so that repeated calendar-client polls do not
# each spend a request against the user's Buffer rate-limit quota.
[[kv_namespaces]]
binding = "FEED_CACHE"
id = "359e9d98dbf94c20b2fdaae903caa471"

[[d1_databases]]
binding = "DB"
database_name = "social-cally"
database_id = "eeb8eac6-1ac5-4a07-aa91-58a34120146e"

# Drives the Google Calendar push. Fires often; each calendar's own refresh
# interval decides whether it is actually due, so a once-a-day calendar is not
# synced every five minutes.
[triggers]
crons = ["*/5 * * * *"]

[vars]
# Public base URL, used to build the feed URLs shown to the user and the OAuth
# redirect URI. Must match the deployed origin exactly.
APP_BASE_URL = "https://social-cally.bgreen.lol"

# Buffer OAuth client ID for "Sign in with Buffer". A client ID is public — it
# ships in the redirect URL every user's browser follows — so it belongs here in
# version control, not in secrets. Unset it and the connect page falls back to a
# pasted personal API key.
BUFFER_CLIENT_ID = "qkC-8N5SSTdhBBd2VNs78ddc1H0aLswbe9TR6UZA6D_"

# Google OAuth client ID for the optional Calendar push. Leave unset to run
# without it — the ICS feed works regardless and the push UI is hidden.
GOOGLE_CLIENT_ID = "1004282263775-u921e08c0ghjhbt203ev0umvogvk9n4c.apps.googleusercontent.com"

# Secrets (set with `wrangler secret put <NAME>`, never committed):
#   ENCRYPTION_KEY       - base64 32-byte AES-256-GCM key, wraps stored credentials
#   BUFFER_CLIENT_SECRET - Buffer OAuth client secret. Optional: Buffer accepts
#                          public clients on PKCE alone, but a Worker can hold a
#                          secret, so set it if the client is confidential.
#   GOOGLE_CLIENT_SECRET - Google OAuth client secret, only needed for the push
